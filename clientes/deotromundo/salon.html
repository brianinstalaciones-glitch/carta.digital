<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Salón · De Otro Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: #050505; }

  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1600px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px; padding: 14px 20px;
  }
  .top-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; text-transform: uppercase; line-height: 1; }
  .top-clock { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-2); }
  .topbar .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .live-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: var(--radius-pill);
    background: rgba(37,211,102,0.16); color: var(--green);
    font-size: 12px; font-weight: 700;
  }
  .live-pill .dot { background: var(--green); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Resumen */
  .summary {
    max-width: 1600px; margin: 0 auto;
    padding: 16px 20px 0;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .stat-pill {
    flex: 1; min-width: 140px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .stat-pill .pip { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .stat-pill .lbl { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
  .stat-pill .val { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; line-height: 1; }
  .stat-pill.libre .pip   { background: var(--text-2); }
  .stat-pill.ocupada .pip { background: var(--orange); box-shadow: 0 0 0 4px rgba(255,80,0,0.2); }
  .stat-pill.cuenta .pip  { background: var(--red); box-shadow: 0 0 0 4px rgba(239,68,68,0.2); }
  .stat-pill.total .pip   { background: var(--gold); }

  /* Grid de mesas */
  .grid-mesas {
    max-width: 1600px; margin: 0 auto;
    padding: 20px 20px 60px;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }

  .mesa {
    aspect-ratio: 1 / 1;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    display: flex; flex-direction: column;
    cursor: pointer;
    transition: transform .15s ease, border-color .2s ease, background .2s ease;
    position: relative;
    overflow: hidden;
  }
  .mesa:hover { transform: translateY(-3px); }
  .mesa::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 80px; height: 80px;
    background: radial-gradient(closest-side, currentColor, transparent 70%);
    opacity: 0; transition: opacity .25s ease;
  }
  .mesa:hover::before { opacity: 0.18; }

  .mesa-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .mesa-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 56px; line-height: 0.9;
    letter-spacing: -0.02em;
  }
  .mesa-num small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-2);
    margin-bottom: 2px;
  }
  .mesa-status {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .mesa-status .mi { font-size: 14px; }

  .mesa-body { margin-top: auto; }
  .mesa-stats {
    display: flex; gap: 14px;
    color: var(--text-2);
    font-size: 12px;
    margin-bottom: 6px;
  }
  .mesa-stats div { display: flex; align-items: center; gap: 4px; }
  .mesa-stats .mi { font-size: 14px; }
  .mesa-total {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 28px; line-height: 1;
  }

  /* Estados */
  .mesa.libre { color: var(--text-dim); }
  .mesa.libre .mesa-num small { color: var(--text-dim); }
  .mesa.libre .mesa-status { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); }
  .mesa.libre .mesa-body { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; color: var(--text-dim); font-size: 13px; }
  .mesa.libre .mesa-body .mi { font-size: 30px; opacity: 0.4; }

  .mesa.ocupada {
    border-color: rgba(255,80,0,0.45);
    background: linear-gradient(135deg, rgba(255,80,0,0.10), rgba(255,80,0,0.02));
    color: var(--orange);
  }
  .mesa.ocupada .mesa-num { color: var(--text); }
  .mesa.ocupada .mesa-status { background: rgba(255,80,0,0.15); color: var(--orange); }
  .mesa.ocupada .mesa-total { color: var(--text); }

  .mesa.cuenta {
    border-color: rgba(239,68,68,0.5);
    background: linear-gradient(135deg, rgba(239,68,68,0.10), rgba(239,68,68,0.02));
    color: var(--red);
    animation: blink-border 1.6s infinite;
  }
  .mesa.cuenta .mesa-num { color: var(--text); }
  .mesa.cuenta .mesa-status { background: rgba(239,68,68,0.18); color: var(--red); }
  .mesa.cuenta .mesa-total { color: var(--text); }
  @keyframes blink-border {
    0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.45); }
    50%     { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
  }

  /* Drawer detalle */
  .drawer-back {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .drawer-back.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; right: 0; top: 0; bottom: 0;
    z-index: 41;
    width: 100%; max-width: 480px;
    background: var(--surface);
    border-left: 1px solid var(--line);
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.22,.61,.36,1);
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }
  .drawer-head h2 {
    margin: 0; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 36px; text-transform: uppercase; line-height: 1;
  }
  .drawer-head .spacer { flex: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
  .drawer-foot { padding: 14px 18px 22px; border-top: 1px solid var(--line); display: grid; gap: 8px; }

  .close-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface-2);
  }
  .close-btn:hover { background: var(--surface-3); }

  .meta-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .meta-row .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .meta-row .pill.ocupada { background: rgba(255,80,0,0.15); color: var(--orange); }
  .meta-row .pill.cuenta  { background: rgba(239,68,68,0.16); color: var(--red); }
  .meta-row .pill.libre   { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); }
  .meta-row .time { color: var(--text-2); font-size: 13px; font-family: 'JetBrains Mono', monospace; }

  .order-block {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px;
    margin-bottom: 10px;
  }
  .order-block .h {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .order-block .h .n {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 22px; color: var(--orange);
  }
  .order-block .h .t { font-size: 12px; color: var(--text-2); font-family: 'JetBrains Mono', monospace; }
  .order-block .h .estado {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .estado-pendiente  { background: rgba(245,158,11,0.16); color: var(--yellow); }
  .estado-preparando { background: rgba(255,80,0,0.16); color: var(--orange); }
  .estado-listo      { background: rgba(37,211,102,0.16); color: var(--green); }
  .estado-entregado  { background: var(--surface-3); color: var(--text-2); }

  .order-items { display: flex; flex-direction: column; gap: 4px; }
  .order-items .li {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 6px;
    font-size: 13px; padding: 4px 0;
    border-top: 1px dashed var(--line);
  }
  .order-items .li:first-child { border-top: none; }
  .order-items .li .q { font-weight: 700; color: var(--orange); }
  .order-items .li.is-reward .q,
  .order-items .li.is-reward .n { color: var(--gold); }
  .order-items .li .obs { grid-column: 2/-1; font-size: 11px; font-style: italic; color: var(--text-2); }

  .order-block .totals {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between;
    font-weight: 700; font-size: 14px;
  }

  .grand-total {
    margin: 18px 0 12px;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(255,80,0,0.08);
    border: 1px solid rgba(255,80,0,0.25);
    display: flex; align-items: center; justify-content: space-between;
  }
  .grand-total .lbl { font-size: 12px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .grand-total .v { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; color: var(--orange); line-height: 1; }

  .empty-detail { padding: 60px 20px; text-align: center; color: var(--text-2); }
  .empty-detail .mi { font-size: 64px; color: var(--text-dim); margin-bottom: 10px; }

  /* Botones agrupados */
  .actions-grid { display: grid; gap: 8px; }
  .actions-grid.two { grid-template-columns: 1fr 1fr; }

  @media (max-width: 640px) {
    .drawer { max-width: 100%; }
    .summary { padding: 12px 16px 0; }
    .grid-mesas { padding: 16px; gap: 10px; }
    .mesa { padding: 14px; }
    .mesa-num { font-size: 44px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo-circle" style="width:44px;height:44px"></div>
    <div>
      <div class="top-title">Salón</div>
      <div class="top-clock" id="clock">--:--</div>
    </div>
    <div class="actions">
      <span class="live-pill"><span class="dot"></span>En vivo</span>
      <a class="btn btn-outline btn-sm" href="cocina.html"><span class="mi">whatshot</span>Cocina</a>
      <a class="btn btn-outline btn-sm" href="admin.html"><span class="mi">settings</span>Admin</a>
    </div>
  </div>
</header>

<section class="summary" id="summary"></section>
<main class="grid-mesas" id="grid"></main>

<!-- Drawer detalle -->
<div class="drawer-back" id="back" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="dTitle">Mesa</h2>
    <div class="spacer"></div>
    <button class="close-btn" onclick="closeDrawer()"><span class="mi">close</span></button>
  </div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-foot" id="dFoot"></div>
</aside>

<script src="data.js"></script>
<script>
let currentMesa = null;

function $(s, el) { return (el||document).querySelector(s); }

// ---- Clock
function tick() {
  $('#clock').textContent = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tick, 1000); tick();

// ---- Listeners reactivos
['storage','deotromundo:mesas','deotromundo:orders','deotromundo:data'].forEach(ev => {
  window.addEventListener(ev, () => {
    render();
    if (currentMesa !== null) renderDrawer(currentMesa);
  });
});
setInterval(() => { render(); if (currentMesa !== null) renderDrawer(currentMesa); }, 30000);

// ---- Helpers
function calcTotalMesa(orders) {
  return orders.reduce((s,o)=>s+(o.total||0),0);
}
function timeOpen(iso) {
  if (!iso) return '';
  const mins = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  if (mins < 1) return 'recién';
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins/60), m = mins % 60;
  return `${h}h ${m}m`;
}
function statusLabel(s) {
  return ({libre:'Libre', ocupada:'Ocupada', cuenta:'Cuenta solicitada'})[s] || s;
}
function statusIcon(s) {
  return ({libre:'chair', ocupada:'restaurant', cuenta:'campaign'})[s] || 'help';
}

// ---- Render principal
function render() {
  const tables = DOM_loadTables();
  const keys = Object.keys(tables).map(k=>parseInt(k,10)).filter(Number.isFinite).sort((a,b)=>a-b);

  // Resumen
  let libres=0, ocup=0, cuenta=0, ventas=0;
  keys.forEach(n => {
    const t = tables[String(n)];
    if (t.estado === 'libre') libres++;
    else if (t.estado === 'ocupada') ocup++;
    else if (t.estado === 'cuenta') cuenta++;
    const orders = DOM_getTableOpenOrders(n);
    ventas += calcTotalMesa(orders);
  });
  $('#summary').innerHTML = `
    <div class="stat-pill libre"><span class="pip"></span><div><div class="lbl">Libres</div><div class="val">${libres}</div></div></div>
    <div class="stat-pill ocupada"><span class="pip"></span><div><div class="lbl">Ocupadas</div><div class="val">${ocup}</div></div></div>
    <div class="stat-pill cuenta"><span class="pip"></span><div><div class="lbl">Cuenta</div><div class="val">${cuenta}</div></div></div>
    <div class="stat-pill total"><span class="pip"></span><div><div class="lbl">Salón en cuenta</div><div class="val">${DOM_fmtPrice(ventas)}</div></div></div>
  `;

  // Grid
  $('#grid').innerHTML = keys.map(n => {
    const t = tables[String(n)];
    const orders = DOM_getTableOpenOrders(n);
    const total = calcTotalMesa(orders);
    const items = orders.reduce((s,o)=>s+(o.items||[]).reduce((x,i)=>x+(i.esRecompensa?0:i.qty),0),0);
    const open = t.fechaApertura;
    if (t.estado === 'libre') {
      return `
        <div class="mesa libre" onclick="openDrawer(${n})">
          <div class="mesa-head">
            <div class="mesa-num"><small>Mesa</small>${n}</div>
            <span class="mesa-status"><span class="mi">chair</span>Libre</span>
          </div>
          <div class="mesa-body">
            <span class="mi">add_circle</span>
            <div>Abrir mesa</div>
          </div>
        </div>
      `;
    }
    return `
      <div class="mesa ${t.estado}" onclick="openDrawer(${n})">
        <div class="mesa-head">
          <div class="mesa-num"><small>Mesa</small>${n}</div>
          <span class="mesa-status"><span class="mi">${statusIcon(t.estado)}</span>${statusLabel(t.estado)}</span>
        </div>
        <div class="mesa-body">
          <div class="mesa-stats">
            <div><span class="mi">schedule</span>${timeOpen(open)}</div>
            <div><span class="mi">restaurant_menu</span>${items} items</div>
            <div><span class="mi">receipt_long</span>${orders.length} pedido${orders.length===1?'':'s'}</div>
          </div>
          <div class="mesa-total">${DOM_fmtPrice(total)}</div>
        </div>
      </div>
    `;
  }).join('');
}

// ---- Drawer
function openDrawer(num) {
  currentMesa = num;
  renderDrawer(num);
  $('#drawer').classList.add('open');
  $('#back').classList.add('open');
}
function closeDrawer() {
  $('#drawer').classList.remove('open');
  $('#back').classList.remove('open');
  currentMesa = null;
}

function renderDrawer(num) {
  const tables = DOM_loadTables();
  const t = tables[String(num)];
  if (!t) { closeDrawer(); return; }
  const orders = DOM_getTableOpenOrders(num);
  const total = calcTotalMesa(orders);

  $('#dTitle').textContent = `Mesa ${num}`;

  if (t.estado === 'libre') {
    $('#dBody').innerHTML = `
      <div class="meta-row">
        <span class="pill libre"><span class="mi" style="font-size:14px">chair</span>Libre</span>
      </div>
      <div class="empty-detail">
        <span class="mi">restaurant</span>
        <h3 style="margin:0 0 6px; font-family:'Barlow Condensed';font-weight:800; font-size:22px; text-transform:uppercase">Mesa libre</h3>
        <p style="margin:0; max-width:280px; margin:0 auto">Marcala como ocupada para empezar a recibir pedidos manualmente, o esperá a que el cliente haga su pedido por la carta seleccionando esta mesa.</p>
      </div>
    `;
    $('#dFoot').innerHTML = `
      <button class="btn btn-primary btn-lg" onclick="actOpen(${num})">
        <span class="mi">play_arrow</span>Abrir mesa
      </button>
    `;
    return;
  }

  const ordersHtml = orders.length ? orders.map(o => {
    const time = new Date(o.fecha).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    return `
      <div class="order-block">
        <div class="h">
          <span class="n">#${o.numero}</span>
          <span class="t">${time}</span>
          <span class="estado estado-${o.estado}">${o.estado}</span>
        </div>
        <div class="order-items">
          ${o.items.map(i => `
            <div class="li ${i.esRecompensa?'is-reward':''}">
              <span class="q">${i.qty}×</span>
              <span class="n">${i.esRecompensa?'🎁 ':''}${i.nombre}</span>
              <span class="p">${i.esRecompensa?'—':DOM_fmtPrice(i.precio*i.qty)}</span>
              ${i.obs?`<div class="obs">${i.obs}</div>`:''}
            </div>
          `).join('')}
        </div>
        ${o.obs ? `<div style="margin-top:8px; font-size:12px; color:var(--text-2); font-style:italic;">"${o.obs}"</div>` : ''}
        <div class="totals"><span>Subtotal</span><span>${DOM_fmtPrice(o.total)}</span></div>
      </div>
    `;
  }).join('') : `
    <div style="padding:18px;text-align:center;color:var(--text-2);font-size:13px">
      Mesa abierta sin pedidos todavía.
    </div>
  `;

  $('#dBody').innerHTML = `
    <div class="meta-row">
      <span class="pill ${t.estado}"><span class="mi" style="font-size:14px">${statusIcon(t.estado)}</span>${statusLabel(t.estado)}</span>
      <span class="time"><span class="mi" style="font-size:14px;vertical-align:-2px">schedule</span> abierta hace ${timeOpen(t.fechaApertura)}</span>
    </div>
    ${ordersHtml}
    <div class="grand-total">
      <div class="lbl">Total mesa</div>
      <div class="v">${DOM_fmtPrice(total)}</div>
    </div>
  `;

  const isCuenta = t.estado === 'cuenta';
  $('#dFoot').innerHTML = `
    <div class="actions-grid two">
      <button class="btn ${isCuenta?'btn-outline':'btn-ghost'}" ${isCuenta?'disabled':''} onclick="actAskBill(${num})">
        <span class="mi">campaign</span>${isCuenta?'Pidió cuenta':'Marcar cuenta'}
      </button>
      <button class="btn btn-ghost" onclick="actPrint(${num})">
        <span class="mi">print</span>Imprimir cuenta
      </button>
    </div>
    <button class="btn btn-primary btn-lg" onclick="actClose(${num})">
      <span class="mi">check_circle</span>Cerrar mesa & cobrar
    </button>
  `;
}

// ---- Acciones
function actOpen(num) {
  DOM_openTable(num);
  renderDrawer(num);
}
function actAskBill(num) {
  DOM_askBillTable(num);
}
function actClose(num) {
  const orders = DOM_getTableOpenOrders(num);
  const total = orders.reduce((s,o)=>s+(o.total||0),0);
  if (!confirm(`¿Cerrar mesa ${num}?\n\nTotal a cobrar: ${DOM_fmtPrice(total)}\nPedidos: ${orders.length}\n\nSe marcarán todos como entregados.`)) return;
  DOM_closeTable(num);
  closeDrawer();
}
function actPrint(num) {
  window.open('comanda.html?mesa=' + num, 'cuenta', 'width=420,height=720');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
});

render();
</script>
</body>
</html>
